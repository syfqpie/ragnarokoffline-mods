name: Attach Mod Zips to Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Zip each mod directory
        run: |
          mkdir -p dist
          for dir in mods/*/; do
            mod_name=$(basename "$dir")
            echo "Zipping $mod_name..."
            (cd mods && zip -r "../dist/${mod_name}.zip" "$mod_name")
          done
          ls -la dist

      - name: Upload zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber