name: Release Mods

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build mod archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          shopt -s nullglob

          for mod in mods/*/; do
            name="$(basename "$mod")"

            echo "Building ${name}.zip"

            (
              cd mods
              zip -r "../dist/${name}.zip" "$name"
            )
          done

      - name: Show release assets
        run: ls -lh dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.zip