name: Build Mods

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod archives
        run: |
          mkdir -p dist

          for mod in mods/*/; do
            name=$(basename "$mod")
            zip -r "dist/${name}.zip" "$mod"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ragnarokoffline-mods
          path: dist/*.zip